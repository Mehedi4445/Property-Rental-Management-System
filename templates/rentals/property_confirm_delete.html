{% extends 'base.html' %}{% block title %}Delete property{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-6"><div class="surface p-4 text-center">
  <div class="fs-1 text-danger"><i class="bi bi-trash3"></i></div>
  <h1 class="h4">Delete "{{ property.title }}"?</h1>
  <p class="muted">Its rental requests and reviews will be deleted too. This can't be undone.</p>
  <form method="post" class="d-flex justify-content-center gap-2">{% csrf_token %}<button class="btn btn-danger">Delete property</button>
  <a class="btn btn-outline-dark" href="{% url 'rentals:owner_dashboard' %}">Keep it</a></form></div></div></div>
{% endblock %}

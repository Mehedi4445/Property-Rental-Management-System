<div class="mb-3">
  {% if field.field.widget.input_type == 'checkbox' %}
    <div class="form-check form-switch">{{ field }}<label class="form-check-label fw-semibold" for="{{ field.id_for_label }}">{{ field.label }}</label></div>
  {% else %}
    <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}
  {% endif %}
  {% if field.help_text %}<div class="form-text">{{ field.help_text|safe }}</div>{% endif %}
  {% for e in field.errors %}<div class="text-danger small mt-1"><i class="bi bi-exclamation-circle"></i> {{ e }}</div>{% endfor %}
</div>
